# Vocabolario bilingue (IT/EN) per l'estrazione degli aspetti (Aspect-Based Sentiment).
# Le parole chiave sono confrontate come parole intere (case-insensitive).
# Forma semplice: `aspetto: [parole chiave]`. Forma estesa: `aspetto: {keywords: [...], opinion_only: [...]}`.
# Le `opinion_only` sono ambigue (es. "bianco e nero" può indicare solo quale versione si guarda): generano
# l'aspetto solo se la frase esprime un'opinione (sentiment non neutro).
# Dopo una modifica: incrementare CLEANING_VERSION in src/processing/sentiment.py e lanciare
# `python -m src.processing.sentiment --reprocess-outdated` per riapplicarlo ai dati esistenti.
directing:
  - direction
  - director
  - directed
  - directing
  - filmmaker
  - regia
  - regista
  - diretto
acting:
  - acting
  - actor
  - actors
  - actress
  - actresses
  - performance
  - performances
  - cast
  - recitazione
  - attore
  - attrice
  - attori
  - interpretazione
soundtrack:
  - soundtrack
  - music
  - composer
  - original score
  - colonna sonora
  - musica
  - compositore
visuals:
  keywords:
    - visuals
    - cinematography
    - cgi
    - vfx
    - visual effects
    - special effects
    - fotografia
    - effetti speciali
    - scenografia
  opinion_only:
    - black and white
    - bianco e nero
    - colori
plot:
  - plot
  - story
  - storyline
  - screenplay
  - script
  - ending
  - pacing
  - trama
  - sceneggiatura
  - finale
  - ritmo
  - storia
