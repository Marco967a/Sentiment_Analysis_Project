version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: sentiment_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=example_password
    restart: unless-stopped

  mongo-express:
    image: mongo-express:latest
    container_name: sentiment_mongo_express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=root
      - ME_CONFIG_MONGODB_ADMINPASSWORD=example_password
      - ME_CONFIG_MONGODB_URL=mongodb://root:example_password@mongodb:27017/
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin
    depends_on:
      - mongodb

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentiment_dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - MONGODB_URI=mongodb://root:example_password@mongodb:27017/
      - MONGODB_DB_NAME=sentiment_db
    depends_on:
      - mongodb

volumes:
  mongodb_data:
